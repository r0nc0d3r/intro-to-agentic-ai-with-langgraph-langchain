[project]
name = "learning-accelerator"
version = "0.1.0"
description = "Learning Accelerator multi-agent system (LangGraph course)"
readme = "README.md"
authors = [
    { name = "r0nc0d3r", email = "109854377+r0nc0d3r@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.1.4",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-core>=1.5.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langfuse>=4.14.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "eval: slow, non-deterministic LLM-as-judge evaluation tests (needs a live LLM_PROVIDER) — excluded from the default run",
]
addopts = "-m 'not eval'"
